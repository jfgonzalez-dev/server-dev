<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
    <title>Nuevo personaje</title>
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <main class="container mt-4">
        <h1>Nuevo personaje</h1>
        <form th:action="@{/gameCharacter/create}" th:object="${gameCharacter}" method="post">
            <div class="mb-3">
                <label class="form-label" for="name">Nombre:</label>
                <input class="form-control" th:field="*{name}" type="text" required>
            </div>
            <div class="mb-3">
                <label class="form-label" for="avatarUrl">Enlace al avatar:</label>
                <input class="form-control" th:field="*{avatarUrl}" type="url">
            </div>
            <div class="mb-3">
                <label class="form-label" for="background">Trasfondo:</label>
                <textarea class="form-control" th:field="*{background}"></textarea>
            </div>
            <div class="mb-3">
                <label class="form-label" for="level">Nivel:</label>
                <input class="form-control" type="number" min="0" th:field="*{level}">
            </div>
            <div class="mb-3">
                <fieldset class="border-0 p-0">
                    <legend class="form-label">Tipo:</legend>

                    <input type="radio" th:field="*{pc}" value="true" id="pcPlayer">
                    <label for="pcPlayer">Personaje Jugador</label>

                    <input type="radio" th:field="*{pc}" value="false" id="pcNonPlayer">
                    <label for="pcNonPlayer">Personaje No Jugador</label>
                </fieldset>
            </div>
            <div class="mb-3">
                <label class="form-label" for="ownerId">Propietario:</label>
                <select class="form-select" th:field="*{ownerId}" required>
                    <option th:each="p : ${players}" th:value="${p.id}" th:text="${p.name}"></option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label" for="campaignId">Campaña:</label>
                <select class="form-select" th:field="*{campaignId}">
                    <option th:value="null">Sin campaña</option>
                    <option th:each="c : ${campaigns}" th:value="${c.id}" th:text="${c.name}"></option>
                </select>
            </div>
            <div class="mt-3">
                <button class="btn btn-primary theme-success" type="submit">Crear</button>
                <a class="btn btn-primary theme-danger" th:href="@{/gameCharacter}">Cancelar</a>
            </div>
        </form>
    </main>
</body>
</html>
