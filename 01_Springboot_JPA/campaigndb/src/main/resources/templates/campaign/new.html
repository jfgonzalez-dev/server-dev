<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
    <title>Nueva campaña</title>
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <main class="container mt-4">
        <h1>Nueva campaña</h1>
        <form th:action="@{/campaign/create}" th:object="${campaign}" method="post">
            <div class="mb-3">
                <label class="form-label" for="name">Nombre:</label>
                <input class="form-control" th:field="*{name}" type="text" required>
            </div>
            <div class="mb-3">
                <label class="form-label" for="description">Descripción:</label>
                <textarea class="form-control" th:field="*{description}"></textarea>
            </div>
            <div class="mb-3">
                <label class="form-label" for="gameSystem">Sistema:</label>
                <select class="form-select" th:field="*{gameSystem}">
                    <option value="DND5E">Dungeons & Dragons 5th Edition</option>
                    <option value="VTM20">Vampire: The Masquerade 20th Anniversary Edition</option>
                    <option value="PATHFINDER">Pathfinder</option>
                    <option value="COC">Call of Cthulhu</option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label" for="status">Estado:</label>
                <select class="form-select" th:field="*{status}">
                    <option value="WIP">En desarrollo</option>
                    <option value="ACTIVE">Activa</option>
                    <option value="ONHOLD">Pausada</option>
                    <option value="FINISHED">Terminada</option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label" for="ownerId">Propietario:</label>
                <select class="form-select" th:field="*{ownerId}" required>
                    <option th:each="p : ${players}" th:value="${p.id}" th:text="${p.name}"></option>
                </select>
            </div>
            <div class="mt-3">
                <button class="btn btn-primary theme-success" type="submit">Crear</button>
                <a class="btn btn-primary theme-danger" th:href="@{/campaign}">Cancelar</a>
            </div>
        </form>
    </main>
</body>
</html>
