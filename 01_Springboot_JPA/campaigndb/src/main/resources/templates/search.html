<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
    <title>Buscador Avanzado</title>
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <main>
        <h1 class="m-2">Buscador Avanzado</h1>
        <section id="filters">
            <ul class="nav nav-tabs ms-2" id="entity" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" id="campaign-tab" data-bs-toggle="tab" data-bs-target="#campaign-tab-pane" type="button" role="tab" aria-controls="campaign-tab-pane" aria-selected="true">Campañas</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="game-character-tab" data-bs-toggle="tab" data-bs-target="#game-character-tab-pane" type="button" role="tab" aria-controls="game-character-tab-pane" aria-selected="false">Personajes</button>
                </li>
            </ul>
            <div class="tab-content p-4" id="entityContent">
                <div class="tab-pane show active" id="campaign-tab-pane" role="tabpanel" aria-labelledby="campaign-tab" tabindex="0">
                    <form th:action="@{/search}" method="get">
                        <input type="hidden" name="entity" value="campaign">
                        <div class="mb-3">
                            <label class="form-label" for="name">Nombre:</label>
                            <input class="form-control" type="text" name="name">
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="gameSystem">Sistema:</label>
                            <select class="form-select" name="gameSystem">
                                <option value="">Todos</option>
                                <option th:each="gs : ${gameSystems}" th:value="${gs}" th:text="${gs}"></option>
                            </select>
                        </div>
                        <div class="mt-3">
                            <label class="form-label" for="status">Estado:</label>
                            <select class="form-select" name="status">
                                <option value="">Todos</option>
                                <option value="WIP">En desarrollo</option>
                                <option value="ACTIVE">Activa</option>
                                <option value="ONHOLD">Pausada</option>
                                <option value="FINISHED">Terminada</option>
                            </select>
                        </div>
                        <div class="mt-3">
                            <label class="form-label" for="ownerId">Propietario:</label>
                            <select class="form-select" name="ownerId">
                                <option value="">Todos los propietarios</option>
                                <option th:each="p : ${allPlayers}" th:value="${p.id}" th:text="${p.name}"></option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary mt-3">Buscar</button>
                    </form>
                </div>
                <div class="tab-pane" id="game-character-tab-pane" role="tabpanel" aria-labelledby="game-character-tab" tabindex="0">
                    <form th:action="@{/search}" method="get"></form>
                    <input type="hidden" name="entity" value="gameCharacter">
                </div>
            </div>
        </section>
        <section id="output">

        </section>
    </main>
</body>
</html>
