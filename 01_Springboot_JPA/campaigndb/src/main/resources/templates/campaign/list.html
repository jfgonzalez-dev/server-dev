<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
    <title>Campañas</title>
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <main class="container mt-4">
        <h1>Campañas</h1>
        <a class="btn btn-primary mb-3" th:href="@{/campaign/new}">Nueva campaña</a>
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Sistema</th>
                    <th>Estado</th>
                    <th>Tiempo de campaña</th>
                    <th>Propietario</th>
                    <th class="text-end">Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="c : ${campaigns.content}">
                    <td><a class="theme-inverse underline-offset-2 underline-20 hover:underline-100" th:text="${c.name}" th:href="@{/campaign/{id}/details(id=${c.id})}"></a></td>
                    <td th:text="${c.gameSystem}"></td>
                    <td th:text="${c.status}"></td>
                    <td th:text="${c.secondsPlayed}"></td>
                    <td th:text="${c.owner.name}"></td>
                    <td>
                        <div class="d-flex flex-nowrap align-items-center gap-1 justify-content-end">
                            <a th:href="@{/campaign/{id}/edit(id=${c.id})}" class="btn btn-text theme-warning" title="Editar">
                                <th:block th:replace="~{fragments/icons :: edit}"></th:block>
                            </a>
                            <a th:href="@{/campaign/{id}/delete(id=${c.id}, pageNumber=${campaigns.number}, pageSize=${campaigns.size})}"
                               class="btn btn-text theme-danger" title="Eliminar" onclick="return confirm('¿Eliminar esta campaña?')">
                                <th:block th:replace="~{fragments/icons :: delete}"></th:block>
                            </a>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
        <nav th:if="${campaigns.totalPages > 0}">
            <ul class="pagination">
                <li class="page-item" th:classappend="${campaigns.first} ? 'disabled'">
                    <a class="page-link" th:href="@{/campaign(pageNumber=${campaigns.number - 1}, pageSize=${campaigns.size})}">
                        <th:block th:replace="~{fragments/icons :: back}"></th:block>
                    </a>
                </li>
                <li class="page-item disabled"><span class="page-link" th:text="${campaigns.number + 1}"></span></li>
                <li class="page-item" th:classappend="${campaigns.last} ? 'disabled'">
                    <a class="page-link" th:href="@{/campaign(pageNumber=${campaigns.number + 1}, pageSize=${campaigns.size})}">
                        <th:block th:replace="~{fragments/icons :: forward}"></th:block>
                    </a>
                </li>
            </ul>
        </nav>
    </main>
</body>
</html>
