<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
    <title th:text="${gameCharacter.name}"></title>
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <main class="container mt-4">
        <section id="gameCharacter" th:object="${gameCharacter}">
            <div class="d-flex flex-nowrap align-items-center gap-4">
                <th:block th:replace="~{fragments/avatar :: avatar(*{avatarUrl}, *{name}, 160)}"></th:block>
                <div>
                    <h1 th:text="*{name}">Nombre</h1>
                    <p th:text="*{background}"></p>
                </div>
            </div>
            <p><strong>ID:</strong> <span th:text="*{id}"></span></p>
            <p><strong>Nivel:</strong> <span th:text="*{level}"></span></p>
            <p><strong>Tipo:</strong> <span th:text="*{pc} ? 'Personaje Jugador' : 'Personaje No Jugador'"></span></p>
            <p><strong>Propietario:</strong> <span th:text="*{owner != null ? owner.name : 'Huérfano'}"></span></p>
            <p>
                <strong>Campaña:</strong>
                <a th:if="*{campaign != null}" class="theme-inverse underline-offset-2 underline-20 hover:underline-100" th:href="@{/campaign/{id}/details(id=*{campaign.id})}" th:text="*{campaign.name}"></a>
                <span th:unless="*{campaign != null}">-</span>
            </p>
            <div class="mt-3">
                <a th:href="@{/gameCharacter}" class="btn btn-text theme-info">
                    <th:block th:replace="~{fragments/icons :: back}"></th:block>
                </a>
                <a th:href="@{/gameCharacter/{id}/edit(id=*{id})}" class="btn btn-text theme-warning">
                    <th:block th:replace="~{fragments/icons :: edit}"></th:block>
                    <span class="ms-1">Editar</span>
                </a>
                <a th:href="@{/gameCharacter/{id}/delete(id=*{id})}" class="btn btn-text theme-danger" onclick="return confirm('¿Eliminar este personaje?')">
                    <th:block th:replace="~{fragments/icons :: delete}">
                    </th:block><span class="ms-1">Eliminar</span>
                </a>
            </div>
        </section>
    </main>
</body>
</html>
